name: Release

# Called by CI after all checks pass for a push to main. When `version` in plugin.config.ts has no tag yet,
# it builds the OpenAI upload ZIP and publishes it as a GitHub release, tagged `v<version>`.
on:
  workflow_call:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No dependency cache: release builds install from the lockfile only.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - name: Find the release tag
        id: tag
        run: |
          tag="v$(node --input-type=module -e 'const { default: config } = await import("./plugin.config.ts"); console.log(config.version)')"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists, so there's nothing to release."
          else
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.tag.outputs.tag
        run: pnpm check
      - if: steps.tag.outputs.tag
        run: pnpm build:openai-zip
      - if: steps.tag.outputs.tag
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish ${{ needs.build.outputs.tag }}
    needs: build
    if: needs.build.outputs.tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: gh release create "$TAG" dist/*.zip --target "$GITHUB_SHA" --title "$TAG" --generate-notes
