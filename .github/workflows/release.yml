name: Release

# Runs when a maintainer pushes a `vX.Y.Z` tag. Builds the OpenAI upload ZIP and attaches it to the GitHub release.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No dependency cache: release builds install from the lockfile only.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm check:release --tag "$GITHUB_REF_NAME"
      - run: pnpm build:openai-zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish ${{ github.ref_name }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" dist/*.zip --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
            exit 0
          fi
          # The ZIP is reproducible, so a re-run uploads only missing files and never replaces a published one.
          mkdir -p "$RUNNER_TEMP/published"
          for zip in dist/*.zip; do
            name="$(basename "$zip")"
            if gh release download "$GITHUB_REF_NAME" --pattern "$name" --dir "$RUNNER_TEMP/published" 2>/dev/null; then
              cmp -s "$zip" "$RUNNER_TEMP/published/$name" || { echo "::error::$name differs from the published file"; exit 1; }
            else
              gh release upload "$GITHUB_REF_NAME" "$zip"
            fi
          done
